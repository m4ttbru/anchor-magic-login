<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Anchor Magic Login</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --row-hover: #f1f5f9; --row-sel: #e0ecff; --accent: #2563eb; --accent-hover: #1d4ed8;
      --chip: #eef2ff; --chip-fg: #3730a3; --warn: #b45309; --err: #b91c1c; --ok: #15803d;
      --card: #eff6ff; --card-line: #bfdbfe; --menu: #ffffff; --shadow: 0 8px 24px rgba(15,23,42,.18);
      --scroll: #cbd5e1; --scroll-hover: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b;
        --row-hover: #111a2e; --row-sel: #16254a; --accent: #3b82f6; --accent-hover: #2563eb;
        --chip: #1e293b; --chip-fg: #c7d2fe; --warn: #fbbf24; --err: #fca5a5; --ok: #4ade80;
        --card: #0f1d3a; --card-line: #1e3a8a; --menu: #111a2e; --shadow: 0 8px 24px rgba(0,0,0,.5);
        --scroll: #0c3d6e; --scroll-hover: #1a5a9a;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    /* No page-level scrollbar: only the site list scrolls, so nothing gets clipped on the right. */
    html { overflow: hidden; }
    body {
      margin: 0; width: 440px; max-height: 590px; display: flex; flex-direction: column; position: relative;
      background: var(--bg); color: var(--fg);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); flex: none; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
    .brand img { width: 18px; height: 18px; }
    .brand .title { flex: 1; min-width: 0; }
    .brand a.dash {
      font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap;
      padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--fg);
    }
    .brand a.dash:hover { border-color: var(--accent); color: var(--accent); }
    input[type=search] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--fg); font: inherit; outline: none;
    }
    input[type=search]:focus { border-color: var(--accent); }
    /* One-line "This tab" strip */
    #current {
      display: none; flex: none; align-items: center; gap: 8px; min-height: 36px;
      padding: 4px 12px; border-bottom: 1px solid var(--line); background: var(--card); font-size: 12px;
    }
    #current .label { flex: none; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    #current .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #current .nm .tag { color: var(--warn); font-weight: 600; margin-left: 4px; }
    #current .status { flex: none; color: var(--ok); font-size: 11px; font-weight: 600; }
    #current button.go { width: 26px; height: 24px; }
    #current button.go svg { width: 15px; height: 15px; }
    #msg { display: none; flex: none; margin: 10px 12px 0; padding: 8px 10px; border-radius: 8px; font-size: 12px; border: 1px solid var(--line); }
    #msg.err { color: var(--err); }
    #msg.ok { color: var(--ok); }
    #list { flex: 1 1 auto; min-height: 0; max-height: 420px; overflow-y: auto; overflow-x: hidden; padding: 4px 0 6px; }
    /* Slim scrollbar: 6px wide, rounded thumb, no track */
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-track { background: transparent; }
    #list::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 6px; min-height: 30px; }
    #list::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
    .site .id { opacity: .6; }
    .section { padding: 8px 12px 2px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .site { display: flex; align-items: center; gap: 6px; padding: 7px 12px; }
    /* Favicon, with a colored letter as the fallback when a site has none */
    .fav {
      flex: none; width: 20px; height: 20px; border-radius: 5px; margin-right: 4px; overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; background: var(--chip);
    }
    .fav img { width: 20px; height: 20px; object-fit: contain; display: block; }
    /* Compact action buttons */
    button.stg { padding: 5px 8px; font-size: 11px; letter-spacing: .04em; }
    button.go { padding: 0; width: 30px; height: 28px; display: flex; align-items: center; justify-content: center; }
    button.go svg { width: 17px; height: 17px; display: block; }
    .site:hover { background: var(--row-hover); }
    .site.sel { background: var(--row-sel); }
    .site .info { flex: 1; min-width: 0; }
    .site .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .host { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site .host a { color: inherit; text-decoration: none; }
    .site .host a:hover { text-decoration: underline; }
    .site .tag { color: var(--warn); font-weight: 600; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer;
      padding: 5px 10px; background: var(--accent); color: #fff; white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button.stg { background: var(--chip); color: var(--chip-fg); }
    button.stg:hover { filter: brightness(0.95); }
    button[disabled] { opacity: .6; cursor: default; }
    button.link { background: none; color: var(--accent); padding: 0; font-weight: 500; }
    button.link:hover { text-decoration: underline; background: none; }
    button.link.on { font-weight: 700; }
    /* Small icon buttons: pin (shows on hover, or always when pinned) and the ⋯ menu */
    button.icon {
      background: none; color: var(--muted); padding: 4px; border-radius: 6px; line-height: 0;
    }
    button.icon:hover { background: var(--line); color: var(--fg); }
    button.icon svg { width: 15px; height: 15px; display: block; }
    button.pin { visibility: hidden; }
    .site:hover button.pin, .site.sel button.pin, button.pin.pinned { visibility: visible; }
    button.pin.pinned { color: var(--accent); }
    .empty { padding: 24px 12px; text-align: center; color: var(--muted); }
    footer {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none;
      border-top: 1px solid var(--line); color: var(--muted); font-size: 11px;
    }
    footer .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ⋯ menu */
    #menu {
      display: none; position: absolute; z-index: 10; width: 230px; padding: 4px;
      background: var(--menu); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    }
    #menu .info { padding: 6px 10px 6px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    #menu .info b { color: var(--fg); display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #menu .info .behind { color: var(--warn); font-weight: 600; }
    #menu button.item {
      display: block; width: 100%; text-align: left; background: none; color: var(--fg);
      font-weight: 500; padding: 7px 10px; border-radius: 6px;
    }
    #menu button.item:hover { background: var(--row-hover); }
    #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon48.png" alt="">
      <span class="title">Anchor Magic Login</span>
      <a class="dash" id="dash" href="https://anchor.host/account/" target="_blank" title="anchor.host/account">Anchor dashboard ↗</a>
    </div>
    <input id="q" type="search" placeholder="Search sites…  ↑↓ to pick, Enter to log in" autofocus autocomplete="off">
  </header>
  <div id="current">
    <span class="label">This tab</span>
    <span class="nm"></span>
    <span class="status" hidden>✓ Logged in</span>
    <button id="currentGo" class="go" hidden></button>
  </div>
  <div id="msg"></div>
  <div id="list"><div class="empty">Loading your sites…</div></div>
  <footer>
    <span id="status" class="grow"></span>
    <button class="link" id="recentBtn" title="Sites you logged into recently">Recent</button>
    <button class="link" id="refresh" title="Reload the site list from Anchor">Refresh</button>
    <button class="link" id="settings">Settings</button>
  </footer>
  <div id="menu" role="menu"></div>
  <script src="popup.js"></script>
</body>
</html>
